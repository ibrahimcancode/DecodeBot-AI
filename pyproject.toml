[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decodebot-ai"
description = "DecodeBot AI — a 100% rule-based conversational agent with an isolated scikit-learn Machine Learning Engine."
readme = "README.md"
license = { text = "MIT" }
keywords = ["chatbot", "rule-based", "machine-learning", "scikit-learn", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dynamic = ["version"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "pandas>=1.5", "numpy>=1.24", "matplotlib>=3.6", "joblib>=1.2"]
dev = ["pytest>=7", "coverage", "ruff", "black"]

[project.scripts]
decodebot = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["decodebot*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = { attr = "decodebot.__version__" }

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
