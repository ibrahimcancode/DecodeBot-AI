name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install ruff black
      - name: Ruff (ML Engine, GUI, entry point)
        run: ruff check decodebot/ml decodebot/gui main.py
      - name: Black (format check)
        run: black --check decodebot/ml decodebot/gui main.py
